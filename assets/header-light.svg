<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Kavyansh Singh, design engineer">
  <style>
    .n { font: 800 76px/1 "Inter Tight", Inter, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -3px; fill: #121212; }
    .r { font: 500 23px/1 Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5d5c56; }
    .m { font: 500 13px/1 "JetBrains Mono", Consolas, "SFMono-Regular", Menlo, monospace; letter-spacing: 2.2px; fill: #5d5c56; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: d 2.4s cubic-bezier(.2,.7,.2,1) .2s forwards; }
